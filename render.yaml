# Render Blueprint Configuration
# This file defines the services for deployment on Render.
#
# IMPORTANT NOTES:
# 1. After deploying, update CORS_ORIGINS in Render dashboard with your actual
#    Render URL (e.g., https://your-app.onrender.com) - OR set RENDER_EXTERNAL_URL
#    as an environment variable in Render dashboard and the app will auto-detect it.
#
# 2. Ollama CANNOT run on Render. You MUST host Ollama on an external server
#    (e.g., VPS, dedicated machine) and update OLLAMA_BASE_URL
#    to point to that external instance BEFORE chat/RAG features will work.
#
# 3. Plan: Starter (512MB RAM). The app is optimized for this plan:
#    - Heavy AI models (sentence-transformers, faiss) are lazy-loaded only on first use
#    - Gunicorn uses 1 worker with no preload to minimize startup memory
#    - Flask startup is ~50-80MB, leaving ~430MB for model loading at runtime

services:
  # Backend Web Service (Flask API + Frontend serving)
  - type: web
    name: enterprise-knowledge-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    # OPTIMIZED: No --preload flag (prevents loading all code into memory at startup)
    # OPTIMIZED: 1 worker only (512MB RAM can't handle more)
    # OPTIMIZED: 300s timeout (models need time to load on first request)
    startCommand: cd backend && gunicorn 'app:create_app()' --worker-class sync --workers 1 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
      # After deployment, update this with your actual Render URL or set
      # RENDER_EXTERNAL_URL env var in Render dashboard for auto-detection.
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173"
      # REQUIRED: Point this to your externally hosted Ollama instance.
      # Ollama does NOT run on Render's infrastructure.
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "gemma3:latest"
      - key: OLLAMA_TIMEOUT
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
      - key: RAG_N_RESULTS
        value: "5"
      - key: MAX_HISTORY_LENGTH
        value: "10"
