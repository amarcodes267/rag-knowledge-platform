# Render Blueprint Configuration
# This file defines the services for deployment on Render.

services:
  # Backend Web Service (Flask API + Frontend serving)
  - type: web
    name: enterprise-knowledge-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:create_app --worker-class sync --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-app.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "gemma3:latest"
      - key: OLLAMA_TIMEOUT
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
